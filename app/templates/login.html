{% extends "base.html" %}
{% block content %}
<section class="panel login-panel">
    <h1>{{ t('login.heading') }}</h1>
    <p class="lede">{{ t('login.lede') }}</p>
    <form action="/login" method="post" class="form-grid">
        <input type="hidden" name="next" value="{{ next }}"/>
        <label class="full">
            <span>{{ t('login.login') }}</span>
            <input type="text" name="login" required autocomplete="username" autofocus value="{{ login_value or '' }}"/>
        </label>
        <label class="full">
            <span>{{ t('login.password') }}</span>
            <input type="password" name="password" required autocomplete="current-password"/>
        </label>
        <div class="full actions">
            <button class="btn btn-primary" type="submit">{{ t('login.submit') }}</button>
        </div>
    </form>
    <p class="muted">{{ t('login.labHint') }}</p>
</section>
{% endblock %}
